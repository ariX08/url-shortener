<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting…</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #fafbf7;
      color: #14161a;
    }
    .box { text-align: center; padding: 2rem; max-width: 420px; }
    .msg { color: #8a8d98; margin-top: 0.75rem; font-size: 0.95rem; }
    a { color: #3f3df2; }
    code { background: #e8e9ee; padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.85rem; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <div class="box">
    <p id="status">Looking up link…</p>
    <p class="msg" id="detail"></p>
  </div>
  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("c");
      const status = document.getElementById("status");
      const detail = document.getElementById("detail");

      function fail(title, message) {
        status.textContent = title;
        detail.innerHTML = message || "";
      }

      if (!code) {
        fail("Missing short code.", '<a href="index.html">Go back</a>');
        return;
      }

      const timeout = setTimeout(() => {
        fail(
          "Request timed out.",
          "Check your Supabase URL/key in <code>config.js</code> and that you ran the latest <code>schema.sql</code>."
        );
      }, 8000);

      try {
        if (
          !window.SUPABASE_URL ||
          window.SUPABASE_URL.includes("YOUR_PROJECT") ||
          !window.SUPABASE_ANON_KEY ||
          window.SUPABASE_ANON_KEY.includes("YOUR_ANON")
        ) {
          clearTimeout(timeout);
          fail(
            "Supabase is not configured.",
            "Open <code>config.js</code> and paste your real Project URL and anon public key."
          );
          return;
        }

        if (typeof supabase === "undefined") {
          clearTimeout(timeout);
          fail("Supabase library failed to load.", "Check your network or ad-blocker.");
          return;
        }

        const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

        // Prefer secure RPC that increments + cleans expired
        let original = null;
        let expired = false;

        const { data: rpcData, error: rpcError } = await sb.rpc("resolve_and_touch", { code });

        if (!rpcError && rpcData && rpcData.length) {
          original = rpcData[0].original_url;
          expired = rpcData[0].expired;
        } else {
          // Fallback for older schema
          const { data, error } = await sb
            .from("links")
            .select("original_url, expires_at")
            .eq("short_code", code)
            .maybeSingle();

          if (error) {
            clearTimeout(timeout);
            fail(
              "Database error.",
              (error.message || "Unknown") +
                "<br><br>Run the latest <code>schema.sql</code> in the Supabase SQL Editor."
            );
            return;
          }
          if (!data) {
            clearTimeout(timeout);
            fail("Link not found.", '<a href="index.html">Create a new one</a>');
            return;
          }
          if (data.expires_at && new Date(data.expires_at) <= new Date()) {
            expired = true;
            original = data.original_url;
            try {
              await sb.from("links").delete().eq("short_code", code);
            } catch (_) {}
          } else {
            original = data.original_url;
            try {
              await sb.rpc("increment_clicks", { code });
            } catch (_) {}
          }
        }

        clearTimeout(timeout);

        if (!original) {
          fail("Link not found.", '<a href="index.html">Create a new one</a>');
          return;
        }

        if (expired) {
          fail("This link has expired and was removed.", '<a href="index.html">Create a new one</a>');
          return;
        }

        status.textContent = "Redirecting…";
        window.location.replace(original);
      } catch (err) {
        clearTimeout(timeout);
        fail(
          "Something went wrong.",
          (err && err.message ? err.message : "Unknown error") +
            "<br><br>Check the browser console (F12) for more details."
        );
      }
    })();
  </script>
</body>
</html>
