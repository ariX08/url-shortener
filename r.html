<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting…</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f7f9fb;
      color: #1a202c;
    }
    .box {
      text-align: center;
      padding: 2rem;
    }
    .msg { color: #4a5568; margin-top: 0.5rem; }
    a { color: #2b6cb0; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <div class="box">
    <p id="status">Looking up link…</p>
    <p class="msg" id="detail"></p>
  </div>
  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("c");
      const status = document.getElementById("status");
      const detail = document.getElementById("detail");

      if (!code) {
        status.textContent = "Missing short code.";
        detail.innerHTML = '<a href="index.html">Go back</a>';
        return;
      }

      if (
        !window.SUPABASE_URL ||
        window.SUPABASE_URL.includes("YOUR_PROJECT") ||
        !window.SUPABASE_ANON_KEY ||
        window.SUPABASE_ANON_KEY.includes("YOUR_ANON")
      ) {
        status.textContent = "Supabase is not configured.";
        detail.textContent = "Add your project URL and anon key in config.js";
        return;
      }

      const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

      const { data, error } = await sb
        .from("links")
        .select("original_url, expires_at")
        .eq("short_code", code)
        .maybeSingle();

      if (error || !data) {
        status.textContent = "Link not found.";
        detail.innerHTML = '<a href="index.html">Create a new one</a>';
        return;
      }

      if (data.expires_at && new Date(data.expires_at) < new Date()) {
        status.textContent = "This link has expired.";
        return;
      }

      // Fire-and-forget click increment
      sb.rpc("increment_clicks", { code }).catch(() => {
        sb.from("links")
          .update({ clicks: sb.rpc ? undefined : 1 }) // fallback ignored
          .eq("short_code", code)
          .then(() => {});
      });

      // Safer: just try the RPC, ignore failure
      try {
        await sb.rpc("increment_clicks", { code });
      } catch (_) {}

      status.textContent = "Redirecting…";
      window.location.replace(data.original_url);
    })();
  </script>
</body>
</html>
