<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 90" width="480" height="90" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .tile { fill: #3F3DF2; }
      .bar { fill: #FAFBF7; }
      .dot { fill: #C8FF3D; }
      .word { font-family: 'Baloo 2', 'Fredoka', 'Nunito', sans-serif; font-weight: 800; }
      .credit { font-family: 'Baloo 2', 'Fredoka', 'Nunito', sans-serif; font-weight: 600; letter-spacing: 0.01em; }
      .ink { fill: #14161A; }
      .grey { fill: #8A8D98; }
    </style>
  </defs>

  <!-- icon tile -->
  <g transform="translate(0, 5)">
    <rect class="tile" x="0" y="0" width="80" height="80" rx="18"/>
    <rect class="bar" x="17.5" y="24" width="45" height="7.5" rx="3.75"/>
    <rect class="bar" x="17.5" y="36" width="30" height="7.5" rx="3.75"/>
    <rect class="bar" x="17.5" y="48" width="16" height="7.5" rx="3.75"/>
    <circle class="dot" cx="39.5" cy="51.75" r="5.5"/>
  </g>

  <!-- wordmark, playful bounce -->
  <text class="word ink" x="100" font-size="44">
    <tspan y="54" rotate="-4">S</tspan><tspan y="51" rotate="3">h</tspan><tspan y="48" rotate="-3" font-size="52" class="dot">o</tspan><tspan y="51" rotate="4">r</tspan><tspan y="54" rotate="-3">t</tspan><tspan y="50" rotate="2">l</tspan><tspan y="52" rotate="-5">y</tspan>
  </text>

  <circle class="dot" cx="380" cy="42" r="4"/>
  <text x="396" y="50" class="credit grey" font-size="18">by arix</text>
</svg>
