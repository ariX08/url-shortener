<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 90" width="390" height="90" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .word { font-family: 'Baloo 2', 'Fredoka', 'Nunito', sans-serif; font-weight: 800; }
